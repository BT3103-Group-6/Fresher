# Continuous integration for Fresher (US 26, part 1: CI).
# It is post-sprint work and does not change the Sprint 2 Definition of Done, 
# which records CI/CD as not met.
#
# On every pull request and push to main it runs, on a clean machine, the checks each
# PR description reported running by hand: functions lint, the production build, and
# the 430 tests that need no Firebase emulators.
# The full emulator suite (npm run test:rules) runs only when started by hand from the
# Actions tab, until it has passed there at least once.
# Nothing here deploys. Automatic deployment (US 26, part 2) needs a Firebase service
# account secret and stays future work.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions

      - name: Lint Cloud Functions
        run: npm --prefix functions run lint

      - name: Build the web app
        # Compile check only: this build is never deployed. vite.config.js refuses to build
        # without Firebase web config, so CI passes clearly labelled placeholders.
        # The real values stay in each developer's .env.local and are used only for deploys.
        env:
          VITE_FIREBASE_API_KEY: ci-placeholder-api-key
          VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_APP_ID: ci-placeholder-app-id
          VITE_APP_CHECK_SITE_KEY: ci-placeholder-site-key
        run: npm run build

      - name: Unit tests (no emulators)
        run: >
          node --test
          tests/blocks.unit.test.mjs
          tests/booking.unit.test.mjs
          tests/dashboard.test.mjs
          tests/dashboardCharts.test.mjs
          tests/demo.unit.test.mjs
          tests/demoData.unit.test.mjs
          tests/deposit.test.mjs
          tests/discovery.test.mjs
          tests/geocode.unit.test.mjs
          tests/history.test.mjs
          tests/notifications.unit.test.mjs
          tests/nfr04.callables.test.mjs
          tests/nfr05.failure.test.mjs
          tests/payments.unit.test.mjs
          tests/queue.unit.test.mjs
          tests/schedule.test.mjs
          tests/service.unit.test.mjs
          tests/shopMap.test.mjs
          tests/slots.test.mjs
          tests/stats.unit.test.mjs
          tests/waitlist.unit.test.mjs
          tests/waitlistUi.test.mjs

  emulator-tests:
    name: Emulator test suite (manual)
    # Started by hand from the Actions tab. Two audit-trail tests are known to depend on
    # the time of day (Sprint 2 retro), so this job does not block pull requests yet.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions
          npm install -g firebase-tools

      - name: Security Rules and emulator tests
        # A demo- project ID keeps the emulators fully offline: nothing reaches fresher-6d857.
        run: firebase emulators:exec --project demo-fresher --only firestore "npm run test:rules"
